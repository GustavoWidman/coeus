[package]
name = "coeus"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "coeus"
path = "src/bin/coeus.rs"

[[bin]]
name = "coeusd"
path = "src/bin/coeusd.rs"

[[bin]]
name = "coeus-launcher"
path = "src/bin/coeus-launcher.rs"

[dependencies]
bytes = "1.12.1"
coeus-proto-macros = { path = "proto-macros" }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
colog = "1.4.0"
colored = "3.1.1"
easy-config-store = "0.3.1"
env_logger = "0.11.11"
eyre = "0.6.12"
futures-util = { version = "0.3.34", features = ["sink"] }
log = "0.4.33"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
snow = { version = "0.10.0", default-features = false, features = [
    "default-resolver",
    "use-getrandom",
    "use-curve25519",
    "use-chacha20poly1305",
    "use-blake2",
] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
humantime-serde = "1.1.1"
rustix = { version = "1.1.6", features = ["system", "process", "fs", "termios"] }
memchr = "2.8.3"
tempfile = "3.27.0"
unicode-width = "0.2.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
clap_complete = "4.6.11"
clap_complete_nushell = "4.6.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
age = { version = "0.12.1", features = ["ssh", "armor"] }
base64 = "0.22.1"
sha2 = "0.10.9"
sha-crypt = { version = "0.6.0", features = ["getrandom"] }
ssh-key = { version = "0.6.7", features = ["ed25519", "getrandom"] }
regex-lite = "0.1.9"
toml = "0.8.23"
zeroize = { version = "1.9.0", features = ["std"] }


[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
