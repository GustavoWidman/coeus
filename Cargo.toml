[package]
name = "coeus"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "coeus"
path = "src/bin/coeus.rs"

[[bin]]
name = "coeusd"
path = "src/bin/coeusd.rs"

[dependencies]
bon = "3.9.3"
bytes = "1.12.1"
coeus-proto-macros = { path = "proto-macros" }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
colog = "1.4.0"
colored = "3.1.1"
easy-config-store = "0.3.1"
env_logger = "0.11.11"
eyre = "0.6.12"
futures-util = { version = "0.3.33", features = ["sink"] }
lazy_static = "1.5.0"
log = "0.4.33"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
snow = { version = "0.10.0", default-features = false, features = [
    "default-resolver",
    "use-getrandom",
    "use-curve25519",
    "use-chacha20poly1305",
    "use-blake2",
] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
toml = "1.1.4"
