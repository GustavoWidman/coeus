# coeusd's settings. on NixOS and nix-darwin the coeus module writes this file
# to /etc/coeus/coeusd.toml from `services.coeus`.
[settings]
# the fleet's pre-shared key: `key = "<64 hex digits>"` inline, or a file
# such as an agenix secret. `coeus keygen` makes one.
key_file = "/run/agenix/coeus-key"

# a second key that may only watch: the machine's view, its history,
# generations and logs, never a deploy, a cancel, a lookup, a catch-up, a
# reboot or an upload. `read_key` inline, or a file; it must differ from the
# fleet key
# read_key_file = "/run/agenix/coeus-read-key"

# the flake repository holding every machine's configuration
flake = "git+https://github.com/GustavoWidman/nix"

# where coeusd accepts connections
listen = "[::]:45729"

# this machine's name in the flake (default: the system hostname)
# hostname = "altar"

# job directories and uploaded working trees
state_dir = "/var/lib/coeus"

# an ssh key for private `git+ssh` flake inputs
# ssh_key_file = "/run/agenix/coeus-deploy-key"

# finished jobs to keep
history = 100

# the program macOS runners start under, installed by coeusd and never
# replaced. nix-darwin needs Full Disk Access to create or delete users: grant
# it to this path once (System Settings > Privacy & Security > Full Disk
# Access), or run `coeus doctor --fix` on the Mac
launcher = "/Library/Application Support/coeus/coeus-launcher"

# catch up with a git ref on its own, e.g. after waking up from sleep
[settings.follow]
ref = "deployed"
interval = "15m"
# rewritten after every successful lookup, for programs on the machine:
# { "ref": "deployed", "rev": "<commit>", "committed": <unix seconds>,
#   "checked": <unix seconds> }, `committed` being the flake's `lastModified`
# and `checked` when the lookup succeeded. a failed lookup leaves it as it
# was, so `checked` ages. unset, nothing is written
state_file = "/run/coeus/follow.json"

# after activating, require the machine to stay reachable or roll back
[settings.guard]
enable = true
timeout = "2m"
tailscale = true

# announce finished jobs, e.g. on an ntfy topic
# [settings.notify]
# url = "https://ntfy.sh/my-fleet"
# on = "failure"

# report catch-ups by Web Push: a machine that caught up, or one that stopped
# trying a commit until the ref moves. without it, nothing is pushed. both
# files are read at every send
[settings.push]
origin = "https://coeus.example.com"
vapid_key_file = "/run/agenix/coeus-push-vapid"
subscriptions_file = "/run/agenix/coeus-push-subscriptions"
