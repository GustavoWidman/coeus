name: check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      nix:
        description: Run nix flake check
        type: boolean
        default: true

# Supersede only PR runs; a release run must finish its checks.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check the version and conventional commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # A force push can drop the previous head from the advertised refs.
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA" || BASE_SHA=
          fi
          python3 .github/scripts/version.py commits --base "$BASE_SHA" --head "$HEAD_SHA"

  # Every system the fleet runs. macOS compiles the platform code Linux never does:
  # launchd runners, the launcher that holds Full Disk Access, and its probe. The NixOS
  # VM test boots on x86_64-linux; the module and the daemon it boots are the same on
  # aarch64-linux, which builds every other check.
  nix:
    name: nix ${{ matrix.system }}
    if: github.event_name == 'pull_request' || inputs.nix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
            vm: true
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            vm: false
          - system: aarch64-darwin
            runner: macos-15
            vm: false
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        if: matrix.vm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            substituters = https://cache.nixos.org/ https://cache.r3dlust.com
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cache.r3dlust.com-1:Wdkf9mes2ued0P7C7CL3Jax1b4KPuJwQpM3h4G/Z+yI=
            system-features = nixos-test benchmark big-parallel kvm
      # The Rust dependency build that release.yml saved on main, when it matches exactly.
      - name: Locate the Rust dependency build
        id: deps
        run: .github/scripts/deps-cache locate >> "$GITHUB_OUTPUT"
      - name: Restore the Rust dependency build
        id: deps-cache
        uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: ${{ steps.deps.outputs.key }}
          nix: false
          paths: ${{ runner.temp }}/coeus-deps
          save: false
      - if: steps.deps-cache.outputs.hit-primary-key == 'true'
        run: .github/scripts/deps-cache import "${{ steps.deps.outputs.path }}"
      - if: matrix.vm || runner.os != 'Linux'
        run: nix flake check --print-build-logs
      - name: Build every check but the VM test
        if: ${{ !matrix.vm && runner.os == 'Linux' }}
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          names=$(nix eval --json ".#checks.$SYSTEM" \
            --apply 'checks: builtins.attrNames (removeAttrs checks [ "nixos" ])' |
            jq -r --arg system "$SYSTEM" '.[] | ".#checks.\($system).\(.)"')
          mapfile -t checks <<< "$names"
          nix build --print-build-logs "${checks[@]}"
      # Records the tree that passed, so the release run of the same tree on main can reuse
      # this check (see .github/scripts/checked-tree). On a pull request this is the merge
      # of the head into the base. The run must succeed as a whole, every system included,
      # before a release reuses it.
      - name: Record the checked tree
        id: tree
        if: github.event_name == 'pull_request' && matrix.vm
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          printf '%s\n' "$tree" > "$RUNNER_TEMP/nix-check-tree"
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request' && matrix.vm
        uses: actions/upload-artifact@v7
        with:
          name: nix-check-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/nix-check-tree
          retention-days: 30
